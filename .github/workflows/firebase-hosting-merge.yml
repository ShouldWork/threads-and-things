name: Validate and deploy production
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npm install --global firebase-tools@15.33.0
      - run: firebase emulators:exec --only firestore --project demo-threads-and-things "npm run test:rules"
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THREADS_AND_THINGS_E0943 }}
      - run: firebase deploy --only firestore,hosting --project threads-and-things-e0943 --non-interactive
