name: Validate and deploy isolated preview
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npm install --global firebase-tools@15.33.0
      - run: firebase emulators:exec --only firestore --project demo-threads-and-things "npm run test:rules"
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
  build_and_preview:
    needs: validate
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # In-memory demo data; this bundle has no Firebase backend or credentials.
      - run: npm run build:preview
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THREADS_AND_THINGS_E0943 }}
          projectId: threads-and-things-e0943
